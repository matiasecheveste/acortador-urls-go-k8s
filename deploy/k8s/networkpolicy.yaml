# Acortador de URLs — Matías Nicolás Echeveste Cardozo
# Redis sólo acepta conexiones de los pods del acortador.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-solo-acortador
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acortador
      ports:
        - port: 6379
